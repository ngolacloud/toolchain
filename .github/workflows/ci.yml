name: ci
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning toolchain.sh

  dry-run:
    # Cada fase tem de correr em dry-run sem erros em cada familia de distro.
    # O dry-run nao instala nada, por isso e seguro em CI.
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12
          - fedora:41
          - rockylinux:9
          - archlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: dependencias minimas
        run: |
          # Rocky/UBI trazem curl-minimal, que CONFLITA com o pacote curl.
          # Arch: `-Sy` seguido de install sem `-u` produz uma actualizacao
          # parcial e quebra dependencias (openssl). Em ambos os casos, so se
          # instala o que falta de facto.
          need() { command -v "$1" >/dev/null 2>&1 || echo "$1"; }
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates git $(need curl)
          elif command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False ca-certificates git $(need curl)
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed ca-certificates git $(need curl)
          fi
          for b in bash curl git; do command -v "$b" >/dev/null || { echo "::error::$b em falta"; exit 1; }; done
      - uses: actions/checkout@v4
      - name: doctor
        run: ./toolchain.sh doctor
      - name: todas as fases em dry-run
        # A saida e SEMPRE mostrada, agrupada por fase. Na primeira versao ia
        # para /tmp/out e so aparecia em caso de falha: a CI provava "sai com 0"
        # e nao mostrava o que o script faria em cada distribuicao — o que para
        # um script de provisionamento e um teste fraco. Ver tambem: foi assim
        # que o aviso de EPEL no Rocky passou por verificado sem o ser.
        run: |
          rc=0
          for f in os rust go python node k8s iac sec obs cli delonix; do
            echo "::group::fase $f"
            if ./toolchain.sh "$f" 2>&1; then :; else echo "::error::fase $f falhou"; rc=1; fi
            echo "::endgroup::"
          done
          exit $rc
